global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # API сервис (статический контент)
  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
    metric_relabel_configs:
      - source_labels: [job]
        target_label: app_name

  # Auth сервис
  - job_name: 'auth'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth:8000']
