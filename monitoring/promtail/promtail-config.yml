server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    pipeline_stages:
      - docker: {}
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
        regex: '/(.*)'
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
      # Пробуем взять service из docker-compose label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
        regex: '(.+)'
      # Fallback: если service пустой, извлекаем из имени контейнера (например, ch_games_1 -> games)
      # Используем оба source_labels: если service из docker-compose пустой, используем имя контейнера
      - source_labels: ['__meta_docker_container_name', '__meta_docker_container_label_com_docker_compose_service']
        target_label: service
        regex: '/ch_(.+)_\d+;'
        replacement: '${1}'
      # Добавляем метку app_name из service для совместимости с Prometheus метриками
      - source_labels: ['service']
        target_label: app_name
        regex: '(.+)'

