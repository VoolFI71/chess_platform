services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrations:
    build:
      context: .
      dockerfile: migrations_service/Dockerfile
    depends_on:
      db:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://chess:chess@db:5432/chess
    restart: "no"

  api:
    build: .
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started
      auth:
        condition: service_started
      courses:
        condition: service_started
      enrollments:
        condition: service_started
      lessons:
        condition: service_started
      games:
        condition: service_started
      email:
        condition: service_started
      notifications:
        condition: service_started
      puzzles:
        condition: service_started
    env_file:
      - .env
    environment:
      WEB_DIR: /app/backend/web
      METRICS_ENABLED: "true"
    volumes:
      - ./backend:/app/backend:ro

  auth:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      users:
        condition: service_started
      email:
        condition: service_started
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
      EMAIL_SERVICE_URL: http://email:8000
      EMAIL_INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    restart: unless-stopped

  users:
    build:
      context: .
      dockerfile: users_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN}
      USERS_INTERNAL_TOKEN: ${USERS_INTERNAL_TOKEN}
      USERS_SERVICE_URL: http://users:8000
    restart: unless-stopped

  enrollments:
    build:
      context: .
      dockerfile: enrollments_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
      ENROLLMENTS_INTERNAL_TOKEN: enrollments-secret
    restart: unless-stopped

  courses:
    build:
      context: .
      dockerfile: courses_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      enrollments:
        condition: service_started
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
      ENROLLMENTS_SERVICE_URL: http://enrollments:8000
      ENROLLMENTS_INTERNAL_TOKEN: enrollments-secret
    restart: unless-stopped

  lessons:
    build:
      context: .
      dockerfile: lessons_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      enrollments:
        condition: service_started
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
      ENROLLMENTS_SERVICE_URL: http://enrollments:8000
      ENROLLMENTS_INTERNAL_TOKEN: enrollments-secret
    restart: unless-stopped

  # games:  # Python микросервис (закомментирован)
  #   build:
  #     context: .
  #     dockerfile: games_service/Dockerfile
  #   depends_on:
  #     db:
  #       condition: service_started
  #     migrations:
  #       condition: service_completed_successfully
  #     users:
  #       condition: service_started
  #   env_file:
  #     - .env
  #   environment:
  #     METRICS_ENABLED: "true"
  #   restart: unless-stopped

  games:
    build:
      context: ./games_service_go
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      users:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://chess:chess@db:5432/chess?sslmode=disable
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-default-secret-key-change-in-production}
      METRICS_ENABLED: "true"
    expose:
      - "8000"
    restart: unless-stopped

  email:
    build:
      context: ./email_service_go
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_started
    env_file:
      - .env
    environment:
      PORT: 8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@power-chess.ru}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Power Chess}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      FRONTEND_RESET_PASSWORD_PATH: ${FRONTEND_RESET_PASSWORD_PATH:-/reset-password}
      DATABASE_URL: postgresql://chess:chess@db:5432/chess?sslmode=disable
      METRICS_ENABLED: "true"
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: notifications_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      users:
        condition: service_started
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
    restart: unless-stopped

  puzzles:
    build:
      context: .
      dockerfile: puzzles_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    depends_on:
      - api
      - auth
      - users
      - courses
      - enrollments
      - payments
      - lessons
      - games
      - email
      - notifications
      - puzzles
      - prometheus
      - grafana
      - loki
    ports:
      - "8080:80"
    volumes:
      - ./nginx/gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Для локальной разработки используем прямой доступ без подпути
      - GF_SERVER_ROOT_URL=http://localhost:3000/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROUTER_LOGGING=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "31000:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    logging:
      driver: "none"

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    depends_on:
      - loki
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    logging:
      driver: "none"

  payments:
    build:
      context: .
      dockerfile: payments_service/Dockerfile
    depends_on:
      db:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      METRICS_ENABLED: "true"
    restart: unless-stopped

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-powerchess}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-powerchess-secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

