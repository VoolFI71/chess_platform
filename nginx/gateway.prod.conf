server {
	listen 80;
	
	# General proxy settings
	proxy_connect_timeout 60s;
	proxy_send_timeout 60s;
	proxy_read_timeout 60s;
	proxy_buffering on;
	proxy_buffer_size 4k;
	proxy_buffers 8 4k;
	proxy_busy_buffers_size 8k;

	# Auth routes -> auth service
	location /api/auth/ {
		proxy_pass http://auth:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}

	# Users routes -> users service
	location /api/users/ {
		proxy_pass http://users:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Friendships routes -> users service
	location /api/friendships/ {
		proxy_pass http://users:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Ratings routes -> users service
	location /api/ratings/ {
		proxy_pass http://users:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}

	# Lessons -> lessons service (nested under courses)
	location ~ ^/api/courses/[^/]+/lessons(/|$) {
		proxy_pass http://lessons:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# PGN files -> lessons service
	location /api/pgn-files/ {
		proxy_pass http://lessons:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Courses -> courses service
	location /api/courses/ {
		proxy_pass http://courses:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Enrollments -> enrollments service
	location /api/enrollments/ {
		proxy_pass http://enrollments:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Payments -> payments service
	location /api/payments/ {
		proxy_pass http://payments:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Payments webhook -> payments service (только для prod)
	location /api/payments/webhook {
		proxy_pass http://payments:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Games REST -> games service
	location /api/games/ {
		proxy_pass http://games:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Session-ID $http_x_session_id;
	}

	# Games WebSocket -> games service
	location /ws/games/ {
		proxy_pass http://games:8000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Session-ID $http_x_session_id;
	}

	# Stats WebSocket -> games service
	location /ws/stats {
		proxy_pass http://games:8000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Notifications WebSocket -> notifications service
	location /ws/notifications {
		proxy_pass http://notifications:8000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Notifications -> notifications service
	location /api/notifications/ {
		proxy_pass http://notifications:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Email service -> email service
	location /api/emails/ {
		proxy_pass http://email:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}

	# Puzzles import -> puzzles service (with extended timeouts for large CSV imports)
	location /api/puzzles/internal/import {
		rewrite ^/api/puzzles/(.*)$ /puzzles/$1 break;
		proxy_pass http://puzzles:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_connect_timeout 60s;
		proxy_send_timeout 3600s;
	}

	# Puzzles -> puzzles service
	location /api/puzzles/ {
		rewrite ^/api/puzzles/(.*)$ /puzzles/$1 break;
		proxy_pass http://puzzles:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Grafana -> grafana service
	location /grafana/ {
		proxy_pass http://grafana:3000/;
		proxy_http_version 1.1;
		
		# Базовые заголовки
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# Заголовки для работы из подпути
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Port $server_port;
		proxy_set_header X-Forwarded-Prefix /grafana;
		proxy_set_header X-Script-Name /grafana;
		
		# Исправление всех возможных редиректов от Grafana
		proxy_redirect default;
		proxy_redirect http://$host/grafana/ /grafana/;
		proxy_redirect http://$host:$server_port/grafana/ /grafana/;
		proxy_redirect https://$host/grafana/ /grafana/;
		proxy_redirect https://$host:$server_port/grafana/ /grafana/;
		proxy_redirect http://grafana:3000/ /grafana/;
		proxy_redirect http://grafana:3000 /grafana/;
		proxy_redirect /login /grafana/login;
		proxy_redirect /api/ /grafana/api/;
		proxy_redirect /public/ /grafana/public/;
		
		# WebSocket support для Grafana
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		
		# Timeouts
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
		
		# Отключаем буферизацию для правильной работы редиректов
		proxy_buffering off;
		
		# Разрешаем большие размеры ответов для Grafana
		client_max_body_size 50M;
	}

	# Block access to .html files
	location ~ \.html$ {
		return 404;
	}

	# Frontend and everything else -> backend api (static pages)
	location / {
		proxy_pass http://api:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		
		# Timeouts
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
		
		# Buffers
		proxy_buffering on;
		proxy_buffer_size 4k;
		proxy_buffers 8 4k;
		proxy_busy_buffers_size 8k;
		
		# Retry on errors
		proxy_next_upstream error timeout http_502 http_503 http_504;
		proxy_next_upstream_tries 2;
		proxy_next_upstream_timeout 10s;
	}
}


