<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинговая таблица - PowerChess | Топ игроков</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Рейтинговая таблица PowerChess. Топ игроков по блицу, рапиду, пуле и задачам. Соревнуйтесь с лучшими шахматистами.">
    <meta name="keywords" content="рейтинговая таблица, топ игроков, лидеры, рейтинг, блиц, рапид, пуля, шахматы">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://power-chess.ru/leaderboard">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://power-chess.ru/leaderboard">
    <meta property="og:title" content="Рейтинговая таблица - PowerChess">
    <meta property="og:description" content="Топ игроков по блицу, рапиду, пуле и задачам. Соревнуйтесь с лучшими шахматистами.">
    <meta property="og:image" content="https://power-chess.ru/og-image.jpg">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Рейтинговая таблица - PowerChess">
    <meta name="twitter:description" content="Топ игроков по блицу, рапиду, пуле и задачам.">
    <meta name="twitter:image" content="https://power-chess.ru/og-image.jpg">
    
    <!-- Загрузка темы до отрисовки страницы -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.body.classList.add('dark');
        }
      } catch {}
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Common Styles -->
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/common.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/notifications.css">
    <link rel="stylesheet" href="/styles/cabinet.css">
    <link rel="stylesheet" href="/styles/leaderboard.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="120x120" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/favicon.png">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">
                    <div class="logo-icon">
                        <div class="chess-pattern"></div>
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                            <defs>
                                <linearGradient id="crown-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#ffd700" />
                                    <stop offset="50%" stop-color="#ffffff" />
                                    <stop offset="100%" stop-color="#ffd700" />
                                </linearGradient>
                            </defs>
                            <rect x="3" y="16" width="18" height="3" fill="url(#crown-gradient)" stroke="#fff" stroke-width="0.5" rx="1.5"/>
                            <path d="M4 16L3 6L6 11L12 3L18 11L21 6L20 16H4Z" fill="url(#crown-gradient)" stroke="#fff" stroke-width="1"/>
                            <circle cx="12" cy="9" r="1.5" fill="#e11d48" stroke="#fff" stroke-width="0.5"/>
                        </svg>
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none">
                            <path d="M7 1L3 7H5L4 11L8 5H6L7 1Z" fill="#ffd700" stroke="#fff" stroke-width="0.8"/>
                        </svg>
                    </div>
                    <div>
                        <div class="gradient-text">PowerChess</div>
                        <div>♔ Шахматная академия</div>
                    </div>
                </a>
                <nav class="nav">
                    <a href="/games" class="nav-link">Играть</a>
                    <a href="/tasks" class="nav-link">Задачи</a>
                    <a href="/leaderboard" class="nav-link active">Рейтинг</a>
                </nav>
                <div class="header-actions">
                    <div id="userActions">
                        <div id="leaderboardUserInfo">
                            <span></span>
                        </div>
                    </div>
                    <button class="theme-toggle" title="Переключить тему" id="themeToggleBtn" onclick="toggleTheme()">
                        <i class="fas fa-sun" id="themeIcon"></i>
                    </button>
                    <div id="authButtons">
                        <a href="/login" class="auth-icon-btn" id="leaderboardAuthBtn" title="Войти / Регистрация">
                            <i class="fas fa-sign-in-alt"></i>
                        </a>
                    </div>
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <i class="fas fa-bars" id="menuIcon"></i>
                    </button>
                    <button class="btn btn-outline logout-btn" id="gamesLogoutBtn" title="Выйти">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
            <!-- Mobile Menu -->
            <div class="mobile-menu" id="mobileMenu">
                <div>
                    <a href="/games" class="nav-link mobile-nav-link">Играть</a>
                    <a href="/tasks" class="nav-link mobile-nav-link">Задачи</a>
                    <a href="/leaderboard" class="nav-link mobile-nav-link active">Рейтинг</a>
                    <hr>
                    <div id="mobileAuthButtons">
                        <a href="/login" class="auth-icon-btn" id="leaderboardAuthBtnMobile" title="Войти / Регистрация">
                            <i class="fas fa-sign-in-alt"></i>
                        </a>
                    </div>
                    <div id="mobileUserActions">
                        <div id="leaderboardUserInfoMobile">
                            <span></span>
                        </div>
                        <button class="btn btn-outline logout-btn" id="gamesLogoutBtnMobile" title="Выйти">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <h1>
                    <i class="fas fa-trophy"></i>
                    Рейтинговая таблица
                </h1>
            </div>

            <div class="format-selector">
                <button class="format-btn active" data-format="blitz">
                    <i class="fas fa-bolt"></i>
                    Блиц
                </button>
                <button class="format-btn" data-format="rapid">
                    <i class="fas fa-clock"></i>
                    Рапид
                </button>
                <button class="format-btn" data-format="bullet">
                    <i class="fas fa-bolt"></i>
                    Пуля
                </button>
                <button class="format-btn" data-format="puzzle">
                    <i class="fas fa-puzzle-piece"></i>
                    Задачи
                </button>
            </div>

            <!-- Search and Filter -->
            <div class="leaderboard-controls">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="leaderboardSearch" class="search-input" placeholder="Поиск игрока...">
                    <button class="search-clear" id="searchClear" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Podium for Top-3 -->
            <div class="podium-container" id="podiumContainer" style="display: none;">
                <!-- Top-3 will be rendered here -->
            </div>

            <!-- Leaderboard Cards -->
            <div class="leaderboard-cards-container" id="leaderboardCardsContainer">
                <div class="leaderboard-loading" id="leaderboardLoading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div>Загрузка рейтинговой таблицы...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/notifications.js"></script>
    <script>
        (() => {
            const state = {
                currentFormat: 'blitz',
                loading: false,
                entries: [],
                currentUserId: null,
                searchQuery: '',
            };

            // Получаем ID текущего пользователя
            async function getCurrentUserId() {
                try {
                    const token = localStorage.getItem('access_token');
                    if (!token) return null;
                    
                    const res = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (res.ok) {
                        const user = await res.json();
                        return user.id || null;
                    }
                } catch (e) {
                    console.error('Failed to get current user:', e);
                }
                return null;
            }

            function getInitials(username) {
                if (!username) return '?';
                const parts = username.trim().split(/\s+/);
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                }
                return username.substring(0, 2).toUpperCase();
            }

            async function loadUserStats(userId) {
                try {
                    const res = await fetch(`/api/users/${userId}/stats`);
                    if (res.ok) {
                        return await res.json();
                    }
                } catch (e) {
                    console.error('Failed to load user stats:', e);
                }
                return null;
            }

            function getFormatStats(userStats, format) {
                if (!userStats || !userStats.by_format) return null;
                return userStats.by_format.find(f => f.format === format) || null;
            }

            function createPodiumCard(entry, position, userStats = null) {
                const card = document.createElement('div');
                card.className = `podium-card top-${position}`;
                card.dataset.rank = position;
                
                const medal = document.createElement('div');
                medal.className = 'podium-medal';
                if (position === 1) medal.innerHTML = '<i class="fas fa-crown"></i>';
                else if (position === 2) medal.innerHTML = '<i class="fas fa-medal"></i>';
                else medal.innerHTML = '<i class="fas fa-medal"></i>';
                
                const avatar = document.createElement('div');
                avatar.className = 'podium-avatar';
                avatar.textContent = getInitials(entry.user.username || entry.user.display_name);
                
                const name = document.createElement('div');
                name.className = 'podium-name';
                const nameLink = document.createElement('a');
                nameLink.href = `/profile/${encodeURIComponent(entry.user.username || entry.user.id)}`;
                nameLink.textContent = entry.user.username || entry.user.display_name || 'Неизвестно';
                name.appendChild(nameLink);
                
                const rating = document.createElement('div');
                rating.className = 'podium-rating';
                rating.textContent = entry.rating;
                
                const stats = document.createElement('div');
                stats.className = 'podium-stats';
                
                const formatStats = getFormatStats(userStats, state.currentFormat);
                if (formatStats) {
                    stats.innerHTML = `
                        <div class="stat-item">
                            <i class="fas fa-trophy"></i>
                            <span>Побед: ${formatStats.wins || 0}</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-chess"></i>
                            <span>Партий: ${formatStats.games || 0}</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-percentage"></i>
                            <span>Побед: ${Math.round(formatStats.win_rate || 0)}%</span>
                        </div>
                    `;
                } else {
                    stats.innerHTML = `
                        <div class="stat-item">
                            <i class="fas fa-star"></i>
                            <span>Рейтинг: ${entry.rating}</span>
                        </div>
                    `;
                }
                
                card.appendChild(medal);
                card.appendChild(avatar);
                card.appendChild(name);
                card.appendChild(rating);
                card.appendChild(stats);
                
                // Добавляем класс для текущего пользователя
                if (state.currentUserId && entry.user.id === state.currentUserId) {
                    card.classList.add('current-user');
                }
                
                return card;
            }

            function createLeaderboardCard(entry, rank) {
                const card = document.createElement('div');
                card.className = 'leaderboard-card';
                card.dataset.rank = rank;
                card.dataset.username = (entry.user.username || '').toLowerCase();
                
                // Добавляем классы для позиций
                if (rank <= 10) card.classList.add('top-10');
                if (rank <= 50) card.classList.add('top-50');
                
                // Добавляем класс для текущего пользователя
                if (state.currentUserId && entry.user.id === state.currentUserId) {
                    card.classList.add('current-user');
                }
                
                const rankDiv = document.createElement('div');
                rankDiv.className = 'card-rank';
                rankDiv.textContent = `#${rank}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'card-avatar';
                avatar.textContent = getInitials(entry.user.username || entry.user.display_name);
                
                const content = document.createElement('div');
                content.className = 'card-content';
                
                const header = document.createElement('div');
                header.className = 'card-header';
                
                const name = document.createElement('div');
                name.className = 'card-name';
                const nameLink = document.createElement('a');
                nameLink.href = `/profile/${encodeURIComponent(entry.user.username || entry.user.id)}`;
                nameLink.textContent = entry.user.username || entry.user.display_name || 'Неизвестно';
                name.appendChild(nameLink);
                
                if (state.currentUserId && entry.user.id === state.currentUserId) {
                    const youBadge = document.createElement('span');
                    youBadge.className = 'you-badge';
                    youBadge.textContent = 'Вы';
                    name.appendChild(youBadge);
                }
                
                const rating = document.createElement('div');
                rating.className = 'card-rating';
                rating.textContent = entry.rating;
                
                header.appendChild(name);
                header.appendChild(rating);
                
                const stats = document.createElement('div');
                stats.className = 'card-stats';
                stats.innerHTML = `
                    <div class="stat-item">
                        <i class="fas fa-star"></i>
                        <span>Рейтинг: ${entry.rating}</span>
                    </div>
                `;
                
                content.appendChild(header);
                content.appendChild(stats);
                
                card.appendChild(rankDiv);
                card.appendChild(avatar);
                card.appendChild(content);
                
                // Анимация появления
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, rank * 30);
                
                return card;
            }

            function renderLeaderboard(entries) {
                const podiumContainer = document.getElementById('podiumContainer');
                const cardsContainer = document.getElementById('leaderboardCardsContainer');
                const loadingEl = document.getElementById('leaderboardLoading');
                
                if (!cardsContainer) return;
                
                // Скрываем загрузку
                if (loadingEl) loadingEl.style.display = 'none';
                
                // Очищаем контейнеры
                if (podiumContainer) podiumContainer.innerHTML = '';
                cardsContainer.innerHTML = '';
                
                if (!entries || entries.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-trophy';
                    empty.appendChild(icon);
                    const text = document.createElement('div');
                    text.textContent = 'Рейтинговая таблица пуста';
                    text.style.fontSize = '1.125rem';
                    empty.appendChild(text);
                    cardsContainer.appendChild(empty);
                    return;
                }
                
                // Фильтрация по поисковому запросу
                let filteredEntries = entries;
                if (state.searchQuery) {
                    const query = state.searchQuery.toLowerCase();
                    filteredEntries = entries.filter(entry => {
                        const username = (entry.user.username || '').toLowerCase();
                        const displayName = (entry.user.display_name || '').toLowerCase();
                        return username.includes(query) || displayName.includes(query);
                    });
                }
                
                // Рендерим пьедестал для топ-3
                if (podiumContainer && filteredEntries.length >= 3) {
                    podiumContainer.style.display = 'grid';
                    const top3 = filteredEntries.slice(0, 3);
                    // Порядок: 2-й, 1-й, 3-й (для визуального пьедестала)
                    const podiumOrder = [top3[1], top3[0], top3[2]];
                    
                    // Загружаем статистику для топ-3 параллельно
                    Promise.all(top3.map(entry => loadUserStats(entry.user.id)))
                        .then(statsArray => {
                            podiumContainer.innerHTML = '';
                            podiumOrder.forEach((entry, idx) => {
                                const position = idx === 0 ? 2 : idx === 1 ? 1 : 3;
                                const statsIndex = idx === 0 ? 1 : idx === 1 ? 0 : 2;
                                const card = createPodiumCard(entry, position, statsArray[statsIndex]);
                                podiumContainer.appendChild(card);
                            });
                        })
                        .catch(() => {
                            // Если не удалось загрузить статистику, рендерим без неё
                            podiumContainer.innerHTML = '';
                            podiumOrder.forEach((entry, idx) => {
                                const position = idx === 0 ? 2 : idx === 1 ? 1 : 3;
                                const card = createPodiumCard(entry, position);
                                podiumContainer.appendChild(card);
                            });
                        });
                } else if (podiumContainer) {
                    podiumContainer.style.display = 'none';
                }
                
                // Рендерим карточки (начиная с 4-го места, если есть топ-3)
                const startIndex = filteredEntries.length >= 3 ? 3 : 0;
                const cardsToRender = filteredEntries.slice(startIndex);
                
                if (cardsToRender.length === 0 && filteredEntries.length > 0) {
                    // Все результаты в топ-3
                    return;
                }
                
                cardsToRender.forEach((entry, index) => {
                    const rank = startIndex + index + 1;
                    const card = createLeaderboardCard(entry, rank);
                    cardsContainer.appendChild(card);
                });
                
                // Прокрутка к текущему пользователю, если он есть
                if (state.currentUserId) {
                    setTimeout(() => {
                        const userCard = cardsContainer.querySelector('.current-user');
                        if (userCard) {
                            userCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            // Подсветка
                            userCard.style.animation = 'highlightPulse 2s ease-in-out';
                        }
                    }, 500);
                }
            }

            async function loadLeaderboard(format = 'blitz') {
                if (state.loading) return;
                
                state.loading = true;
                state.currentFormat = format;
                
                const loadingEl = document.getElementById('leaderboardLoading');
                const cardsContainer = document.getElementById('leaderboardCardsContainer');
                const podiumContainer = document.getElementById('podiumContainer');
                
                if (loadingEl) loadingEl.style.display = 'flex';
                if (cardsContainer) cardsContainer.innerHTML = '';
                if (podiumContainer) podiumContainer.style.display = 'none';
                
                try {
                    const res = await fetch(`/api/ratings/leaderboard?format_type=${format}&limit=50`);
                    if (!res.ok) {
                        throw new Error('Failed to load leaderboard');
                    }
                    
                    const data = await res.json();
                    state.entries = data.entries || [];
                    
                    renderLeaderboard(state.entries);
                } catch (e) {
                    console.error('Failed to load leaderboard:', e);
                    const cardsContainer = document.getElementById('leaderboardCardsContainer');
                    if (cardsContainer) {
                        cardsContainer.innerHTML = '';
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'empty-state';
                        errorDiv.style.color = 'var(--danger)';
                        const errorIcon = document.createElement('i');
                        errorIcon.className = 'fas fa-exclamation-triangle';
                        errorDiv.appendChild(errorIcon);
                        const errorText = document.createElement('div');
                        errorText.textContent = 'Не удалось загрузить рейтинговую таблицу';
                        errorDiv.appendChild(errorText);
                        const retryBtn = document.createElement('button');
                        retryBtn.className = 'btn btn-primary';
                        retryBtn.style.marginTop = '1rem';
                        retryBtn.textContent = 'Попробовать снова';
                        retryBtn.onclick = () => loadLeaderboard(format);
                        errorDiv.appendChild(retryBtn);
                        cardsContainer.appendChild(errorDiv);
                    }
                } finally {
                    state.loading = false;
                    const loadingEl = document.getElementById('leaderboardLoading');
                    if (loadingEl) loadingEl.style.display = 'none';
                }
            }

            // Поиск
            function setupSearch() {
                const searchInput = document.getElementById('leaderboardSearch');
                const searchClear = document.getElementById('searchClear');
                
                if (!searchInput) return;
                
                let searchTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    state.searchQuery = e.target.value.trim();
                    
                    if (state.searchQuery) {
                        if (searchClear) searchClear.style.display = 'flex';
                    } else {
                        if (searchClear) searchClear.style.display = 'none';
                    }
                    
                    searchTimeout = setTimeout(() => {
                        renderLeaderboard(state.entries);
                    }, 300);
                });
                
                if (searchClear) {
                    searchClear.addEventListener('click', () => {
                        searchInput.value = '';
                        state.searchQuery = '';
                        searchClear.style.display = 'none';
                        renderLeaderboard(state.entries);
                    });
                }
            }

            // Инициализация
            document.addEventListener('DOMContentLoaded', async () => {
                // Инициализация темы
                if (window.loadTheme && typeof window.loadTheme === 'function') {
                    window.loadTheme();
                }
                
                // Получаем ID текущего пользователя
                state.currentUserId = await getCurrentUserId();
                
                // Настройка поиска
                setupSearch();
                
                // Инициализация фильтров формата
                const formatButtons = document.querySelectorAll('.format-btn');
                formatButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        formatButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const format = btn.dataset.format;
                        loadLeaderboard(format);
                    });
                });
                
                // Загружаем блиц по умолчанию
                loadLeaderboard('blitz');
            });
        })();
    </script>
</body>
</html>
