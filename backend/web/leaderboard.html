    <script>
        (() => {
            const state = {
                currentFormat: 'blitz',
                loading: false,
                entries: [],
                currentUserId: null,
                searchQuery: '',
            };

            // Получаем ID текущего пользователя
            async function getCurrentUserId() {
                try {
                    const res = await fetch('/api/auth/me', {
                        credentials: 'include'
                    });
                    if (res.ok) {
                        const user = await res.json();
                        return user.id || null;
                    }
                } catch (e) {
                    console.error('Failed to get current user:', e);
                }
                return null;
            }

            function getInitials(username) {
                if (!username) return '?';
                const parts = username.trim().split(/\s+/);
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                }
                return username.substring(0, 2).toUpperCase();
            }

            async function loadUserStats(userId) {
                try {
                    const res = await fetch(`/api/users/${userId}/stats`);
                    if (res.ok) {
                        return await res.json();
                    }
                } catch (e) {
                    console.error('Failed to load user stats:', e);
                }
                return null;
            }

            function getFormatStats(userStats, format) {
                if (!userStats || !userStats.by_format) return null;
                return userStats.by_format.find(f => f.format === format) || null;
            }

            function createPodiumCard(entry, position, userStats = null) {
                const card = document.createElement('div');
                card.className = `podium-card top-${position}`;
                card.dataset.rank = position;
                
                const medal = document.createElement('div');
                medal.className = 'podium-medal';
                if (position === 1) medal.innerHTML = '<i class="fas fa-crown"></i>';
                else if (position === 2) medal.innerHTML = '<i class="fas fa-medal"></i>';
                else medal.innerHTML = '<i class="fas fa-medal"></i>';
                
                const avatar = document.createElement('div');
                avatar.className = 'podium-avatar';
                avatar.textContent = getInitials(entry.user.username || entry.user.display_name);
                
                const name = document.createElement('div');
                name.className = 'podium-name';
                const nameLink = document.createElement('a');
                nameLink.href = `/profile/${encodeURIComponent(entry.user.username || entry.user.id)}`;
                nameLink.textContent = entry.user.username || entry.user.display_name || 'Неизвестно';
                name.appendChild(nameLink);
                
                const rating = document.createElement('div');
                rating.className = 'podium-rating';
                rating.textContent = entry.rating;
                
                const stats = document.createElement('div');
                stats.className = 'podium-stats';
                
                const formatStats = getFormatStats(userStats, state.currentFormat);
                if (formatStats) {
                    // Безопасное создание элементов через DOM API (защита от XSS)
                    const statItem1 = document.createElement('div');
                    statItem1.className = 'stat-item';
                    const icon1 = document.createElement('i');
                    icon1.className = 'fas fa-trophy';
                    const span1 = document.createElement('span');
                    span1.textContent = `Побед: ${formatStats.wins || 0}`;
                    statItem1.appendChild(icon1);
                    statItem1.appendChild(span1);
                    
                    const statItem2 = document.createElement('div');
                    statItem2.className = 'stat-item';
                    const icon2 = document.createElement('i');
                    icon2.className = 'fas fa-chess';
                    const span2 = document.createElement('span');
                    span2.textContent = `Партий: ${formatStats.games || 0}`;
                    statItem2.appendChild(icon2);
                    statItem2.appendChild(span2);
                    
                    const statItem3 = document.createElement('div');
                    statItem3.className = 'stat-item';
                    const icon3 = document.createElement('i');
                    icon3.className = 'fas fa-percentage';
                    const span3 = document.createElement('span');
                    span3.textContent = `Побед: ${Math.round(formatStats.win_rate || 0)}%`;
                    statItem3.appendChild(icon3);
                    statItem3.appendChild(span3);
                    
                    stats.appendChild(statItem1);
                    stats.appendChild(statItem2);
                    stats.appendChild(statItem3);
                } else {
                    // Безопасное создание элементов через DOM API (защита от XSS)
                    const statItem = document.createElement('div');
                    statItem.className = 'stat-item';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-star';
                    const span = document.createElement('span');
                    span.textContent = `Рейтинг: ${entry.rating}`;
                    statItem.appendChild(icon);
                    statItem.appendChild(span);
                    stats.appendChild(statItem);
                }
                
                card.appendChild(medal);
                card.appendChild(avatar);
                card.appendChild(name);
                card.appendChild(rating);
                card.appendChild(stats);
                
                // Добавляем класс для текущего пользователя
                if (state.currentUserId && entry.user.id === state.currentUserId) {
                    card.classList.add('current-user');
                }
                
                return card;
            }

            function createLeaderboardCard(entry, rank) {
                const card = document.createElement('div');
                card.className = 'leaderboard-card';
                card.dataset.rank = rank;
                card.dataset.username = (entry.user.username || '').toLowerCase();
                
                // Добавляем классы для позиций
                if (rank <= 10) card.classList.add('top-10');
                if (rank <= 50) card.classList.add('top-50');
                
                // Добавляем класс для текущего пользователя
                if (state.currentUserId && entry.user.id === state.currentUserId) {
                    card.classList.add('current-user');
                }
                
                const rankDiv = document.createElement('div');
                rankDiv.className = 'card-rank';
                rankDiv.textContent = `#${rank}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'card-avatar';
                avatar.textContent = getInitials(entry.user.username || entry.user.display_name);
                
                const content = document.createElement('div');
                content.className = 'card-content';
                
                const header = document.createElement('div');
                header.className = 'card-header';
                
                const name = document.createElement('div');
                name.className = 'card-name';
                const nameLink = document.createElement('a');
                nameLink.href = `/profile/${encodeURIComponent(entry.user.username || entry.user.id)}`;
                nameLink.textContent = entry.user.username || entry.user.display_name || 'Неизвестно';
                name.appendChild(nameLink);
                
                if (state.currentUserId && entry.user.id === state.currentUserId) {
                    const youBadge = document.createElement('span');
                    youBadge.className = 'you-badge';
                    youBadge.textContent = 'Вы';
                    name.appendChild(youBadge);
                }
                
                const rating = document.createElement('div');
                rating.className = 'card-rating';
                rating.textContent = entry.rating;
                
                header.appendChild(name);
                header.appendChild(rating);
                
                const stats = document.createElement('div');
                stats.className = 'card-stats';
                // Безопасное создание элементов через DOM API (защита от XSS)
                const statItem = document.createElement('div');
                statItem.className = 'stat-item';
                const icon = document.createElement('i');
                icon.className = 'fas fa-star';
                const span = document.createElement('span');
                span.textContent = `Рейтинг: ${entry.rating}`;
                statItem.appendChild(icon);
                statItem.appendChild(span);
                stats.appendChild(statItem);
                
                content.appendChild(header);
                content.appendChild(stats);
                
                card.appendChild(rankDiv);
                card.appendChild(avatar);
                card.appendChild(content);
                
                // Анимация появления
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, rank * 30);
                
                return card;
            }

            function renderLeaderboard(entries) {
                const podiumContainer = document.getElementById('podiumContainer');
                const cardsContainer = document.getElementById('leaderboardCardsContainer');
                const loadingEl = document.getElementById('leaderboardLoading');
                
                if (!cardsContainer) return;
                
                // Скрываем загрузку
                if (loadingEl) loadingEl.style.display = 'none';
                
                // Очищаем контейнеры
                if (podiumContainer) podiumContainer.innerHTML = '';
                cardsContainer.innerHTML = '';
                
                if (!entries || entries.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    const icon = document.createElement('i');
                    icon.className = 'fas fa-trophy';
                    empty.appendChild(icon);
                    const text = document.createElement('div');
                    text.textContent = 'Рейтинговая таблица пуста';
                    text.style.fontSize = '1.125rem';
                    empty.appendChild(text);
                    cardsContainer.appendChild(empty);
                    return;
                }
                
                // Фильтрация по поисковому запросу
                let filteredEntries = entries;
                if (state.searchQuery) {
                    const query = state.searchQuery.toLowerCase();
                    filteredEntries = entries.filter(entry => {
                        const username = (entry.user.username || '').toLowerCase();
                        const displayName = (entry.user.display_name || '').toLowerCase();
                        return username.includes(query) || displayName.includes(query);
                    });
                }
                
                // Рендерим пьедестал для топ-3
                if (podiumContainer && filteredEntries.length >= 3) {
                    podiumContainer.style.display = 'grid';
                    const top3 = filteredEntries.slice(0, 3);
                    // Порядок: 2-й, 1-й, 3-й (для визуального пьедестала)
                    const podiumOrder = [top3[1], top3[0], top3[2]];
                    
                    // Загружаем статистику для топ-3 параллельно
                    Promise.all(top3.map(entry => loadUserStats(entry.user.id)))
                        .then(statsArray => {
                            podiumContainer.innerHTML = '';
                            podiumOrder.forEach((entry, idx) => {
                                const position = idx === 0 ? 2 : idx === 1 ? 1 : 3;
                                const statsIndex = idx === 0 ? 1 : idx === 1 ? 0 : 2;
                                const card = createPodiumCard(entry, position, statsArray[statsIndex]);
                                podiumContainer.appendChild(card);
                            });
                        })
                        .catch(() => {
                            // Если не удалось загрузить статистику, рендерим без неё
                            podiumContainer.innerHTML = '';
                            podiumOrder.forEach((entry, idx) => {
                                const position = idx === 0 ? 2 : idx === 1 ? 1 : 3;
                                const card = createPodiumCard(entry, position);
                                podiumContainer.appendChild(card);
                            });
                        });
                } else if (podiumContainer) {
                    podiumContainer.style.display = 'none';
                }
                
                // Рендерим карточки (начиная с 4-го места, если есть топ-3)
                const startIndex = filteredEntries.length >= 3 ? 3 : 0;
                const cardsToRender = filteredEntries.slice(startIndex);
                
                if (cardsToRender.length === 0 && filteredEntries.length > 0) {
                    // Все результаты в топ-3
                    return;
                }
                
                cardsToRender.forEach((entry, index) => {
                    const rank = startIndex + index + 1;
                    const card = createLeaderboardCard(entry, rank);
                    cardsContainer.appendChild(card);
                });
                
                // Прокрутка к текущему пользователю, если он есть
                if (state.currentUserId) {
                    setTimeout(() => {
                        const userCard = cardsContainer.querySelector('.current-user');
                        if (userCard) {
                            userCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            // Подсветка
                            userCard.style.animation = 'highlightPulse 2s ease-in-out';
                        }
                    }, 500);
                }
            }

            async function loadLeaderboard(format = 'blitz') {
                if (state.loading) return;
                
                state.loading = true;
                state.currentFormat = format;
                
                const loadingEl = document.getElementById('leaderboardLoading');
                const cardsContainer = document.getElementById('leaderboardCardsContainer');
                const podiumContainer = document.getElementById('podiumContainer');
                
                if (loadingEl) loadingEl.style.display = 'flex';
                if (cardsContainer) cardsContainer.innerHTML = '';
                if (podiumContainer) podiumContainer.style.display = 'none';
                
                try {
                    const res = await fetch(`/api/ratings/leaderboard?format_type=${format}&limit=50`);
                    if (!res.ok) {
                        throw new Error('Failed to load leaderboard');
                    }
                    
                    const data = await res.json();
                    state.entries = data.entries || [];
                    
                    renderLeaderboard(state.entries);
                } catch (e) {
                    console.error('Failed to load leaderboard:', e);
                    const cardsContainer = document.getElementById('leaderboardCardsContainer');
                    if (cardsContainer) {
                        cardsContainer.innerHTML = '';
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'empty-state';
                        errorDiv.style.color = 'var(--danger)';
                        const errorIcon = document.createElement('i');
                        errorIcon.className = 'fas fa-exclamation-triangle';
                        errorDiv.appendChild(errorIcon);
                        const errorText = document.createElement('div');
                        errorText.textContent = 'Не удалось загрузить рейтинговую таблицу';
                        errorDiv.appendChild(errorText);
                        const retryBtn = document.createElement('button');
                        retryBtn.className = 'btn btn-primary';
                        retryBtn.style.marginTop = '1rem';
                        retryBtn.textContent = 'Попробовать снова';
                        retryBtn.onclick = () => loadLeaderboard(format);
                        errorDiv.appendChild(retryBtn);
                        cardsContainer.appendChild(errorDiv);
                    }
                } finally {
                    state.loading = false;
                    const loadingEl = document.getElementById('leaderboardLoading');
                    if (loadingEl) loadingEl.style.display = 'none';
                }
            }

            // Поиск
            function setupSearch() {
                const searchInput = document.getElementById('leaderboardSearch');
                const searchClear = document.getElementById('searchClear');
                
                if (!searchInput) return;
                
                let searchTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    state.searchQuery = e.target.value.trim();
                    
                    if (state.searchQuery) {
                        if (searchClear) searchClear.style.display = 'flex';
                    } else {
                        if (searchClear) searchClear.style.display = 'none';
                    }
                    
                    searchTimeout = setTimeout(() => {
                        renderLeaderboard(state.entries);
                    }, 300);
                });
                
                if (searchClear) {
                    searchClear.addEventListener('click', () => {
                        searchInput.value = '';
                        state.searchQuery = '';
                        searchClear.style.display = 'none';
                        renderLeaderboard(state.entries);
                    });
                }
            }

            // Mobile menu functions теперь в mobile-menu.js

            // Инициализация
            document.addEventListener('DOMContentLoaded', async () => {
                // Инициализация темы
                if (window.loadTheme && typeof window.loadTheme === 'function') {
                    window.loadTheme();
                }
                
                // Получаем ID текущего пользователя
                state.currentUserId = await getCurrentUserId();
                
                // Настройка поиска
                setupSearch();
                
                // Инициализация фильтров формата
                const formatButtons = document.querySelectorAll('.format-btn');
                formatButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        formatButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const format = btn.dataset.format;
                        loadLeaderboard(format);
                    });
                });
                
                // Загружаем блиц по умолчанию
                loadLeaderboard('blitz');
            });
        })();
    </script>
