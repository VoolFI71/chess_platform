    <!-- Mail.ru OAuth SDK -->
    <script src="https://oauth.mail.ru/sdk/v0.18.0/oauth.js"></script>
    <script>
        // Инициализация Mail.ru OAuth SDK
        if (typeof MR !== 'undefined') {
            MR.init({
                clientId: '019b405f9d2a78b7a9e5e21763e7f8ea',
                scopes: [MR.SCOPE_USER_INFO, 'openid'],
                onlogin: async function (state) {
                    console.info('MR.login:', state);
                    
                    // Проверяем статус авторизации
                    if (state.status !== 'connected') {
                        console.error('Mail.ru OAuth: пользователь не авторизован или не дал разрешение');
                        alert('Для входа через Mail.ru необходимо дать разрешение на доступ');
                        return;
                    }
                    
                    // Получаем access_token из state (согласно документации Mail.ru SDK)
                    const accessToken = state.access_token;
                    
                    if (!accessToken) {
                        console.error('Mail.ru OAuth: access_token не найден в state');
                        alert('Ошибка: не удалось получить токен от Mail.ru');
                        return;
                    }
                    
                    try {
                        // Отправляем access_token на наш сервер
                        const response = await fetch('/api/auth/mailru/token', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                access_token: accessToken
                            }),
                        });
                        
                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({ detail: 'Неизвестная ошибка' }));
                            throw new Error(errorData.detail || 'Ошибка при авторизации через Mail.ru');
                        }
                        
                        // Обновляем UI и редиректим
                        if (typeof window.me === 'function') {
                            const user = await window.me();
                            if (typeof window.updateAuthUI === 'function') {
                                window.updateAuthUI(user);
                            }
                        }
                        
                        // Редирект на главную
                        window.location.href = '/';
                    } catch (error) {
                        console.error('Mail.ru OAuth error:', error);
                        alert(error.message || 'Не удалось войти через Mail.ru');
                    }
                },
                onlogout: function (state) {
                    console.info('MR.logout:', state);
                    fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                }
            });
        }
        
        // Google OAuth
        const googleLoginButton = document.getElementById('google-login-button');
        if (googleLoginButton) {
            googleLoginButton.addEventListener('click', function() {
                window.location.href = '/api/auth/google/authorize';
            });
        }
    </script>
